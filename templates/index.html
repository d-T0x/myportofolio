
{% extends 'base.html' %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/dzaki.jpg" alt="Photo of my Instagram profile!">
                </div>
                <div class="hero-details">
                    <p class="bio">
                        {{ bio }}    
                    </p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/d-T0x" class="social-link" target="_blank">GitHub</a>
                        <a href="https://www.linkedin.com/in/hafizuddindzakiazzam/" class="social-link" target="_blank">LinkedIn</a>
                        <a href="mailto:dzaki.azzam06@gmail.com" class="social-link" target="_blank">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
