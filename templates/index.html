
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">HDA</a>
            <nav class="nav-bar">
                <nav>
                    <a href="{% url 'main:show_main' %}" class="nav-opt">Profile</a>
                </nav>
                <nav>
                    <a href="{% url 'main:show_experience' %}" class="nav-opt">Experience</a>
                </nav>
                <nav>
                    <a href="{% url 'main:show_project' %}" class="nav-opt">Project</a>
                </nav>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/dzaki.jpg" alt="Photo of my Instagram profile!">
                </div>
                <div class="hero-details">
                    <p class="bio">
                        {{ bio }}    
                    </p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/d-T0x" class="social-link" target="_blank">GitHub</a>
                        <a href="https://www.linkedin.com/in/hafizuddindzakiazzam/" class="social-link" target="_blank">LinkedIn</a>
                        <a href="mailto:dzaki.azzam06@gmail.com" class="social-link" target="_blank">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
